---
# Each group is one onboarding target. A server's target is whatever its group_vars and
# host_vars set, so the same play sends servers to different subscriptions, resource groups
# and regions. All IDs and names here are examples.
all:
  children:
    arc_servers:
      children:
        arc_production:
          hosts:
            web01.corp.example:
            web02.corp.example:
            db01.corp.example:
        arc_development:
          hosts:
            dev01.corp.example:
            dev02.corp.example:
