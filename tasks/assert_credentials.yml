---
- name: Check the credentials for the chosen sign-in method
  ansible.builtin.assert:
    that: >-
      {{
        {
          'service_principal_secret': [
            azure_arc_tenant_id | length > 0,
            azure_arc_service_principal_id | length > 0,
            azure_arc_service_principal_secret | length > 0
          ],
          'service_principal_certificate': [
            azure_arc_tenant_id | length > 0,
            azure_arc_service_principal_id | length > 0,
            azure_arc_service_principal_certificate_file | length > 0
          ],
          'access_token': [azure_arc_access_token | length > 0]
        }[azure_arc_auth_method]
      }}
    fail_msg: >-
      azure_arc_auth_method is {{ azure_arc_auth_method }}.
      service_principal_secret needs azure_arc_tenant_id, azure_arc_service_principal_id and
      azure_arc_service_principal_secret. service_principal_certificate needs
      azure_arc_tenant_id, azure_arc_service_principal_id and
      azure_arc_service_principal_certificate_file. access_token needs azure_arc_access_token.
    quiet: true
